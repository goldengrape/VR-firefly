<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>VR Firefly · WebXR Light Flock</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    canvas{display:block}
    button,input{font:inherit}
    #settings{
      position:fixed;inset:0;z-index:30;display:grid;place-items:center;
      padding:24px;background:radial-gradient(circle at center,rgba(28,28,28,.72),rgba(0,0,0,.96) 68%);
    }
    #panel{
      width:min(560px,100%);max-height:92vh;overflow:auto;
      padding:22px;border:1px solid rgba(255,255,255,.2);border-radius:16px;
      background:rgba(5,5,5,.9);box-shadow:0 20px 70px rgba(0,0,0,.65)
    }
    h1{font-size:20px;margin:0 0 8px}
    .intro{font-size:13px;line-height:1.6;opacity:.72;margin-bottom:18px}
    .setting{display:grid;grid-template-columns:1fr auto;gap:7px 14px;padding:12px 0;border-top:1px solid rgba(255,255,255,.1)}
    .setting label{font-size:14px}
    .setting output{min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
    .setting input[type=range]{grid-column:1/-1;width:100%;accent-color:#fff}
    .hint{grid-column:1/-1;font-size:11px;line-height:1.45;opacity:.48}
    .actions{display:flex;gap:10px;margin-top:18px}
    .actions button,#reopen{
      border:1px solid rgba(255,255,255,.24);border-radius:10px;
      background:#fff;color:#000;padding:12px 16px;cursor:pointer
    }
    #reset{background:transparent;color:#fff}
    #info{
      position:fixed;left:16px;top:16px;z-index:10;max-width:440px;padding:12px 14px;
      background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.18);
      border-radius:10px;line-height:1.45;font-size:13px;pointer-events:none;user-select:none;
      display:none
    }
    #status{opacity:.68;margin-top:6px}
    #reopen{
      position:fixed;right:16px;top:16px;z-index:20;background:rgba(0,0,0,.62);
      color:#fff;padding:9px 12px;font-size:12px;display:none
    }
    @media (max-width:600px){
      #settings{padding:12px}
      #panel{padding:18px;border-radius:13px}
      .actions{flex-direction:column}
      .actions button{width:100%}
    }
  </style>
  <script type="importmap">
  {
    "imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="settings">
    <div id="panel">
      <h1>VR Firefly</h1>
      <div class="intro">
        先设定光点群参数，再开始运行。开始后会出现 ENTER VR 按钮。
      </div>

      <div class="setting">
        <label for="count">光点数量</label>
        <output id="countOut">240</output>
        <input id="count" type="range" min="60" max="500" step="20" value="240">
        <div class="hint">数量越大越密集，但计算量会明显增加。独立 VR 头显建议先保持在 300 以下。</div>
      </div>

      <div class="setting">
        <label for="speed">运行速度</label>
        <output id="speedOut">1.00×</output>
        <input id="speed" type="range" min="0.25" max="2.50" step="0.05" value="1">
      </div>

      <div class="setting">
        <label for="wander">随机游动</label>
        <output id="wanderOut">0.48</output>
        <input id="wander" type="range" min="0" max="1.5" step="0.05" value="0.48">
        <div class="hint">越高越像躁动的萤火虫；越低越像稳定的鸟群。</div>
      </div>

      <div class="setting">
        <label for="radius">活动半径</label>
        <output id="radiusOut">3.1 m</output>
        <input id="radius" type="range" min="1.5" max="6" step="0.1" value="3.1">
      </div>

      <div class="setting">
        <label for="head">头部影响</label>
        <output id="headOut">1.00×</output>
        <input id="head" type="range" min="0" max="3" step="0.05" value="1">
        <div class="hint">控制探身、平移和转头对附近光点造成的扰动强度。</div>
      </div>

      <div class="setting">
        <label for="size">光点大小</label>
        <output id="sizeOut">0.055</output>
        <input id="size" type="range" min="0.015" max="0.12" step="0.005" value="0.055">
      </div>

      <div class="actions">
        <button id="start">开始运行</button>
        <button id="reset" type="button">恢复默认</button>
      </div>
    </div>
  </div>

  <div id="info">
    <b>VR Firefly</b><br>
    白色光点在玩家附近按 Boids 规则飞行。移动、探身和转头会扰动它们。
    <div id="status">模拟已运行</div>
  </div>

  <button id="reopen" type="button">重新设置</button>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    const BASE={
      minSpeed:.28,maxSpeed:1.05,maxForce:1.55,
      separationRadius:.22,alignmentRadius:.62,cohesionRadius:.78,
      separationWeight:1.65,alignmentWeight:.72,cohesionWeight:.55,
      preferredDistance:1.55,returnWeight:1.25,
      headPersonalSpace:.42,headInfluenceRadius:1.35,
      headRepelWeight:3.2,headMotionWeight:1.45,headTurnWeight:1.15,
      opacity:.95
    };

    const CONFIG={
      count:240,
      speedScale:1,
      wanderWeight:.48,
      flockRadius:3.1,
      headScale:1,
      pointSize:.055,
      ...BASE
    };

    const ui={
      settings:document.querySelector('#settings'),
      info:document.querySelector('#info'),
      status:document.querySelector('#status'),
      reopen:document.querySelector('#reopen'),
      start:document.querySelector('#start'),
      reset:document.querySelector('#reset'),
      count:document.querySelector('#count'),
      speed:document.querySelector('#speed'),
      wander:document.querySelector('#wander'),
      radius:document.querySelector('#radius'),
      head:document.querySelector('#head'),
      size:document.querySelector('#size'),
      countOut:document.querySelector('#countOut'),
      speedOut:document.querySelector('#speedOut'),
      wanderOut:document.querySelector('#wanderOut'),
      radiusOut:document.querySelector('#radiusOut'),
      headOut:document.querySelector('#headOut'),
      sizeOut:document.querySelector('#sizeOut')
    };

    const defaults={
      count:'240',speed:'1',wander:'0.48',radius:'3.1',head:'1',size:'0.055'
    };

    function syncOutputs(){
      ui.countOut.value=ui.count.value;
      ui.speedOut.value=Number(ui.speed.value).toFixed(2)+'×';
      ui.wanderOut.value=Number(ui.wander.value).toFixed(2);
      ui.radiusOut.value=Number(ui.radius.value).toFixed(1)+' m';
      ui.headOut.value=Number(ui.head.value).toFixed(2)+'×';
      ui.sizeOut.value=Number(ui.size.value).toFixed(3);
    }

    ['count','speed','wander','radius','head','size'].forEach(k=>{
      ui[k].addEventListener('input',syncOutputs);
    });
    syncOutputs();

    const scene=new THREE.Scene();
    scene.background=new THREE.Color(0x000000);

    const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
    camera.position.set(0,1.6,0);

    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.xr.enabled=true;
    renderer.xr.setReferenceSpaceType('local-floor');
    document.body.appendChild(renderer.domElement);

    const vrButton=VRButton.createButton(renderer);
    vrButton.style.display='none';
    document.body.appendChild(vrButton);

    renderer.xr.addEventListener('sessionstart',()=>{
      ui.status.textContent='VR 模式：头部运动正在影响光点';
      ui.reopen.style.display='none';
    });

    renderer.xr.addEventListener('sessionend',()=>{
      ui.status.textContent='模拟已运行，可再次进入 VR';
      if(running)ui.reopen.style.display='block';
    });

    function glowTexture(){
      const s=128,c=document.createElement('canvas');c.width=c.height=s;
      const x=c.getContext('2d');
      const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
      g.addColorStop(0,'rgba(255,255,255,1)');
      g.addColorStop(.16,'rgba(255,255,255,1)');
      g.addColorStop(.38,'rgba(255,255,255,.55)');
      g.addColorStop(.72,'rgba(255,255,255,.1)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=g;x.fillRect(0,0,s,s);
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
    }

    const glow=glowTexture();

    let N=0;
    let positions=null,velocities=null,phases=null;
    let geometry=null,material=null,points=null,posAttr=null;
    let sepR2=0,aliR2=0,cohR2=0,headR2=0,personalR2=0;
    let running=false;

    function unit(){
      const z=Math.random()*2-1,a=Math.random()*Math.PI*2,r=Math.sqrt(Math.max(0,1-z*z));
      return [r*Math.cos(a),z,r*Math.sin(a)];
    }

    function destroyFlock(){
      if(points)scene.remove(points);
      if(geometry)geometry.dispose();
      if(material)material.dispose();
      points=geometry=material=posAttr=null;
      positions=velocities=phases=null;
      N=0;
    }

    function createFlock(){
      destroyFlock();

      N=CONFIG.count;
      positions=new Float32Array(N*3);
      velocities=new Float32Array(N*3);
      phases=new Float32Array(N*3);

      for(let i=0;i<N;i++){
        const k=i*3,d=unit();
        const maxSpawn=Math.min(CONFIG.flockRadius*.8,2.8);
        const r=.65+Math.pow(Math.random(),.65)*Math.max(.2,maxSpawn-.65);

        positions[k]=d[0]*r;
        positions[k+1]=1.6+d[1]*r*.72;
        positions[k+2]=d[2]*r;

        const v=unit(),s=CONFIG.minSpeed+Math.random()*.38;
        velocities[k]=v[0]*s;
        velocities[k+1]=v[1]*s;
        velocities[k+2]=v[2]*s;

        phases[k]=Math.random()*Math.PI*2;
        phases[k+1]=Math.random()*Math.PI*2;
        phases[k+2]=Math.random()*Math.PI*2;
      }

      geometry=new THREE.BufferGeometry();
      posAttr=new THREE.BufferAttribute(positions,3);
      posAttr.setUsage(THREE.DynamicDrawUsage);
      geometry.setAttribute('position',posAttr);

      material=new THREE.PointsMaterial({
        color:0xffffff,size:CONFIG.pointSize,map:glow,
        transparent:true,opacity:CONFIG.opacity,depthWrite:false,
        blending:THREE.AdditiveBlending,sizeAttenuation:true
      });

      points=new THREE.Points(geometry,material);
      points.frustumCulled=false;
      scene.add(points);

      sepR2=CONFIG.separationRadius**2;
      aliR2=CONFIG.alignmentRadius**2;
      cohR2=CONFIG.cohesionRadius**2;
      headR2=CONFIG.headInfluenceRadius**2;
      personalR2=CONFIG.headPersonalSpace**2;
    }

    function applySettings(){
      CONFIG.count=Number(ui.count.value);
      CONFIG.speedScale=Number(ui.speed.value);
      CONFIG.wanderWeight=Number(ui.wander.value);
      CONFIG.flockRadius=Number(ui.radius.value);
      CONFIG.headScale=Number(ui.head.value);
      CONFIG.pointSize=Number(ui.size.value);
    }

    const headPos=new THREE.Vector3(0,1.6,0);
    const prevHeadPos=new THREE.Vector3(0,1.6,0);
    const headVelocity=new THREE.Vector3();
    const rawHeadVelocity=new THREE.Vector3();
    const headForward=new THREE.Vector3(0,0,-1);
    const prevHeadForward=new THREE.Vector3(0,0,-1);
    const turnVelocity=new THREE.Vector3();
    const rawTurnVelocity=new THREE.Vector3();
    const quat=new THREE.Quaternion();
    const targetCenter=new THREE.Vector3();
    let first=true,elapsed=0;

    function resetHeadTracking(){
      first=true;
      headVelocity.set(0,0,0);
      turnVelocity.set(0,0,0);
    }

    function updateHead(dt,frame){
      if(renderer.xr.isPresenting&&frame){
        const ref=renderer.xr.getReferenceSpace();
        const pose=frame.getViewerPose(ref);
        if(pose){
          const p=pose.transform.position,q=pose.transform.orientation;
          headPos.set(p.x,p.y,p.z);
          quat.set(q.x,q.y,q.z,q.w);
          headForward.set(0,0,-1).applyQuaternion(quat).normalize();
        }
      }else{
        camera.getWorldPosition(headPos);
        camera.getWorldDirection(headForward).normalize();
      }

      if(first||dt<=0){
        prevHeadPos.copy(headPos);
        prevHeadForward.copy(headForward);
        headVelocity.set(0,0,0);
        turnVelocity.set(0,0,0);
        first=false;
        return;
      }

      rawHeadVelocity.copy(headPos).sub(prevHeadPos).divideScalar(dt);
      if(rawHeadVelocity.lengthSq()>16)rawHeadVelocity.setLength(4);
      headVelocity.lerp(rawHeadVelocity,.28);

      rawTurnVelocity.copy(headForward).sub(prevHeadForward).divideScalar(dt);
      if(rawTurnVelocity.lengthSq()>25)rawTurnVelocity.setLength(5);
      turnVelocity.lerp(rawTurnVelocity,.22);

      prevHeadPos.copy(headPos);
      prevHeadForward.copy(headForward);
    }

    function limit3(x,y,z,max){
      const l2=x*x+y*y+z*z,m2=max*max;
      if(l2>m2&&l2>0){
        const s=max/Math.sqrt(l2);
        return [x*s,y*s,z*s];
      }
      return [x,y,z];
    }

    function updateFlock(dt){
      if(!positions||!velocities)return;

      targetCenter.copy(headForward).multiplyScalar(CONFIG.preferredDistance*.42).add(headPos);

      for(let i=0;i<N;i++){
        const ik=i*3,px=positions[ik],py=positions[ik+1],pz=positions[ik+2];
        const vx=velocities[ik],vy=velocities[ik+1],vz=velocities[ik+2];

        let sx=0,sy=0,sz=0,sc=0;
        let axn=0,ayn=0,azn=0,ac=0;
        let cx0=0,cy0=0,cz0=0,cc=0;

        for(let j=0;j<N;j++){
          if(i===j)continue;
          const jk=j*3;
          const dx=positions[jk]-px,dy=positions[jk+1]-py,dz=positions[jk+2]-pz;
          const d2=dx*dx+dy*dy+dz*dz;

          if(d2<sepR2&&d2>.000001){
            const inv=1/d2;
            sx-=dx*inv;sy-=dy*inv;sz-=dz*inv;sc++;
          }
          if(d2<aliR2){
            axn+=velocities[jk];ayn+=velocities[jk+1];azn+=velocities[jk+2];ac++;
          }
          if(d2<cohR2){
            cx0+=positions[jk];cy0+=positions[jk+1];cz0+=positions[jk+2];cc++;
          }
        }

        let ax=0,ay=0,az=0;

        if(sc){
          const f=limit3(sx/sc,sy/sc,sz/sc,CONFIG.maxForce);
          ax+=f[0]*CONFIG.separationWeight;
          ay+=f[1]*CONFIG.separationWeight;
          az+=f[2]*CONFIG.separationWeight;
        }
        if(ac){
          const f=limit3(axn/ac-vx,ayn/ac-vy,azn/ac-vz,CONFIG.maxForce);
          ax+=f[0]*CONFIG.alignmentWeight;
          ay+=f[1]*CONFIG.alignmentWeight;
          az+=f[2]*CONFIG.alignmentWeight;
        }
        if(cc){
          const f=limit3(cx0/cc-px,cy0/cc-py,cz0/cc-pz,CONFIG.maxForce);
          ax+=f[0]*CONFIG.cohesionWeight;
          ay+=f[1]*CONFIG.cohesionWeight;
          az+=f[2]*CONFIG.cohesionWeight;
        }

        const wx=Math.sin(elapsed*.73+phases[ik])+Math.cos(elapsed*.31+phases[ik+1]*1.7);
        const wy=Math.sin(elapsed*.57+phases[ik+1])+Math.cos(elapsed*.27+phases[ik+2]*1.3);
        const wz=Math.sin(elapsed*.67+phases[ik+2])+Math.cos(elapsed*.35+phases[ik]*1.4);
        ax+=wx*.5*CONFIG.wanderWeight;
        ay+=wy*.5*CONFIG.wanderWeight;
        az+=wz*.5*CONFIG.wanderWeight;

        const cx=targetCenter.x-px,cy=targetCenter.y-py,cz=targetCenter.z-pz;
        const cd=Math.sqrt(cx*cx+cy*cy+cz*cz);

        if(cd>CONFIG.preferredDistance){
          const t=Math.min(1,(cd-CONFIG.preferredDistance)/Math.max(.001,CONFIG.flockRadius-CONFIG.preferredDistance));
          const w=CONFIG.returnWeight*(.25+1.75*t)/Math.max(cd,.001);
          ax+=cx*w;ay+=cy*w;az+=cz*w;
        }

        const hx=px-headPos.x,hy=py-headPos.y,hz=pz-headPos.z;
        const hd2=hx*hx+hy*hy+hz*hz;

        if(hd2<headR2&&CONFIG.headScale>0){
          const hd=Math.sqrt(Math.max(hd2,.000001));
          const proximity=1-hd/CONFIG.headInfluenceRadius;
          const hs=CONFIG.headScale;

          if(hd2<personalR2){
            const personal=1-hd/CONFIG.headPersonalSpace,inv=1/hd;
            ax+=hx*inv*CONFIG.headRepelWeight*personal*hs;
            ay+=hy*inv*CONFIG.headRepelWeight*personal*hs;
            az+=hz*inv*CONFIG.headRepelWeight*personal*hs;
          }

          const headSpeed=Math.min(2.5,headVelocity.length());
          if(headSpeed>.015){
            ax+=headVelocity.x*CONFIG.headMotionWeight*proximity*hs;
            ay+=headVelocity.y*CONFIG.headMotionWeight*proximity*hs;
            az+=headVelocity.z*CONFIG.headMotionWeight*proximity*hs;

            const rx=headVelocity.y*hz-headVelocity.z*hy;
            const ry=headVelocity.z*hx-headVelocity.x*hz;
            const rz=headVelocity.x*hy-headVelocity.y*hx;
            const rl=Math.sqrt(rx*rx+ry*ry+rz*rz);

            if(rl>.00001){
              const w=.34*proximity*headSpeed*hs;
              ax+=rx/rl*w;ay+=ry/rl*w;az+=rz/rl*w;
            }
          }

          if(turnVelocity.length()>.01){
            const tx=turnVelocity.y*hz-turnVelocity.z*hy;
            const ty=turnVelocity.z*hx-turnVelocity.x*hz;
            const tz=turnVelocity.x*hy-turnVelocity.y*hx;
            ax+=tx*CONFIG.headTurnWeight*proximity*hs;
            ay+=ty*CONFIG.headTurnWeight*proximity*hs;
            az+=tz*CONFIG.headTurnWeight*proximity*hs;
          }
        }

        [ax,ay,az]=limit3(ax,ay,az,CONFIG.maxForce*2.35);

        let nvx=vx+ax*dt,nvy=vy+ay*dt,nvz=vz+az*dt;
        let sp=Math.sqrt(nvx*nvx+nvy*nvy+nvz*nvz);

        if(sp>CONFIG.maxSpeed){
          const s=CONFIG.maxSpeed/sp;nvx*=s;nvy*=s;nvz*=s;
        }else if(sp<CONFIG.minSpeed&&sp>.00001){
          const s=CONFIG.minSpeed/sp;nvx*=s;nvy*=s;nvz*=s;
        }

        velocities[ik]=nvx;velocities[ik+1]=nvy;velocities[ik+2]=nvz;
        positions[ik]=px+nvx*dt;
        positions[ik+1]=py+nvy*dt;
        positions[ik+2]=pz+nvz*dt;

        if(cd>CONFIG.flockRadius*1.75){
          positions[ik]+=cx*dt*1.8;
          positions[ik+1]+=cy*dt*1.8;
          positions[ik+2]+=cz*dt*1.8;
        }
      }

      posAttr.needsUpdate=true;
    }

    ui.start.addEventListener('click',()=>{
      applySettings();
      createFlock();
      resetHeadTracking();
      elapsed=0;
      running=true;

      ui.settings.style.display='none';
      ui.info.style.display='block';
      ui.reopen.style.display='block';
      vrButton.style.display='';
      ui.status.textContent='模拟已运行，点击 ENTER VR 进入沉浸模式';
    });

    ui.reopen.addEventListener('click',()=>{
      if(renderer.xr.isPresenting)return;
      running=false;
      destroyFlock();
      vrButton.style.display='none';
      ui.info.style.display='none';
      ui.reopen.style.display='none';
      ui.settings.style.display='grid';
    });

    ui.reset.addEventListener('click',()=>{
      for(const [k,v] of Object.entries(defaults))ui[k].value=v;
      syncOutputs();
    });

    let previous=performance.now();

    renderer.setAnimationLoop((time,frame)=>{
      let dt=(time-previous)/1000;
      previous=time;
      dt=Math.min(Math.max(dt,.001),.035);

      if(running){
        updateHead(dt,frame);
        const simDt=dt*CONFIG.speedScale;
        elapsed+=simDt;
        updateFlock(simDt);
      }

      renderer.render(scene,camera);
    });

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
